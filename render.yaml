services:
  - type: web
    name: ai-critical-thinking-lab
    runtime: static
    branch: main
    buildCommand: echo "Static site - no build required"
    staticPublishPath: .
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
