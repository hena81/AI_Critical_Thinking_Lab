<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="مختبر التفكير النقدي بالذكاء الاصطناعي - نظام تعليمي مبتكر لتعزيز التفكير النقدي والإبداع">
    <meta name="keywords" content="تفكير نقدي, ذكاء اصطناعي, تعليم, إبداع, critical thinking, AI, education">
    <title>مختبر التفكير النقدي بالذكاء الاصطناعي | AI Critical Thinking Lab</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>

    <!-- Dexie.js (IndexedDB wrapper) -->
    <script src="https://unpkg.com/dexie@4.0.11/dist/dexie.min.js"></script>

    <!-- App CSS -->
    <link rel="stylesheet" href="css/styles.css?v=20261121-about-guide">
</head>
<body>
    <!-- ===== Animated Background ===== -->
    <div class="bg-cosmos" id="bgCosmos">
        <canvas id="particlesCanvas"></canvas>
    </div>

    <!-- ===== App Root ===== -->
    <div id="app">

        <!-- ===== Navigation Bar ===== -->
        <nav class="navbar" id="navbar">
            <div class="navbar-container">
                <div class="navbar-brand" id="navBrand">
                    <div class="brand-icon">
                        <svg viewBox="0 0 40 40" fill="none">
                            <circle cx="20" cy="20" r="18" stroke="url(#brandGrad)" stroke-width="2.5"/>
                            <path d="M14 20C14 16.686 16.686 14 20 14C23.314 14 26 16.686 26 20" stroke="url(#brandGrad)" stroke-width="2" stroke-linecap="round"/>
                            <path d="M12 26L20 14L28 26" stroke="url(#brandGrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
                            <circle cx="20" cy="20" r="3" fill="url(#brandGrad)"/>
                            <defs>
                                <linearGradient id="brandGrad" x1="0" y1="0" x2="40" y2="40">
                                    <stop stop-color="#00d4ff"/>
                                    <stop offset="1" stop-color="#7c3aed"/>
                                </linearGradient>
                            </defs>
                        </svg>
                    </div>
                    <span class="brand-text" data-i18n="appName">مختبر التفكير النقدي</span>
                </div>

                <div class="navbar-links" id="navLinks">
                    <a href="#" class="nav-link active" data-page="home" data-i18n="nav.home">الرئيسية</a>
                    <a href="#" class="nav-link" data-page="about" data-i18n="nav.about">عن المشروع والدليل</a>
                    <a href="#" class="nav-link" data-page="challenges" data-i18n="nav.challenges">التحديات</a>
                    <a href="#" class="nav-link" data-page="profile" data-i18n="nav.profile">ملفي</a>
                    <a href="#" class="nav-link teacher-only" data-page="dashboard" data-i18n="nav.dashboard">لوحة التحكم</a>
                </div>

                <div class="navbar-actions">
                    <button class="btn-icon lang-toggle" id="langToggle" title="English">
                        <span class="lang-label">EN</span>
                    </button>
                    <button class="btn btn-sm btn-secondary auth-nav-btn hidden" id="navLoginBtn" data-page="auth" data-i18n="auth.login">تسجيل الدخول</button>
                    <div class="user-menu" id="userMenu">
                        <button class="btn-icon user-avatar" id="userAvatar">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                                <circle cx="12" cy="7" r="4"/>
                            </svg>
                        </button>
                        <div class="user-dropdown" id="userDropdown">
                            <div class="dropdown-header">
                                <span class="dropdown-name" id="dropdownName"></span>
                                <span class="dropdown-role" id="dropdownRole"></span>
                            </div>
                            <div class="dropdown-divider"></div>
                            <a href="#" class="dropdown-item" data-page="profile" data-i18n="nav.profile">ملفي الشخصي</a>
                            <a href="#" class="dropdown-item" id="logoutBtn" data-i18n="nav.logout">تسجيل الخروج</a>
                        </div>
                    </div>
                    <button class="btn-icon mobile-menu-toggle" id="mobileMenuToggle">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="3" y1="6" x2="21" y2="6"/>
                            <line x1="3" y1="12" x2="21" y2="12"/>
                            <line x1="3" y1="18" x2="21" y2="18"/>
                        </svg>
                    </button>
                </div>
            </div>
        </nav>

        <!-- ===== Page: Auth (Login/Register) ===== -->
        <section class="page page-auth" id="pageAuth">
            <div class="auth-container">
                <div class="auth-card glass-card">
                    <div class="auth-language" aria-label="Interface language">
                        <button type="button" class="auth-lang-option" data-auth-lang="ar">العربية</button>
                        <button type="button" class="auth-lang-option" data-auth-lang="en">English</button>
                    </div>

                    <div class="auth-header">
                        <div class="auth-logo">
                            <svg viewBox="0 0 60 60" fill="none">
                                <circle cx="30" cy="30" r="27" stroke="url(#authGrad)" stroke-width="3"/>
                                <path d="M21 30C21 25.029 25.029 21 30 21C34.971 21 39 25.029 39 30" stroke="url(#authGrad)" stroke-width="2.5" stroke-linecap="round"/>
                                <path d="M18 39L30 21L42 39" stroke="url(#authGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
                                <circle cx="30" cy="30" r="4.5" fill="url(#authGrad)"/>
                                <defs>
                                    <linearGradient id="authGrad" x1="0" y1="0" x2="60" y2="60">
                                        <stop stop-color="#00d4ff"/>
                                        <stop offset="1" stop-color="#7c3aed"/>
                                    </linearGradient>
                                </defs>
                            </svg>
                        </div>
                        <h1 class="auth-title" data-i18n="auth.welcome">مختبر التفكير النقدي</h1>
                        <p class="auth-subtitle" data-i18n="auth.subtitle">شريكك الفكري لتعزيز التفكير النقدي والإبداع</p>
                    </div>

                    <!-- Login Form -->
                    <form class="auth-form" id="loginForm">
                        <div class="form-group">
                            <label for="loginUsername" data-i18n="auth.username">اسم المستخدم</label>
                            <div class="input-wrapper">
                                <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                                    <circle cx="12" cy="7" r="4"/>
                                </svg>
                                <input type="text" id="loginUsername" required autocomplete="username">
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="loginPassword" data-i18n="auth.password">كلمة المرور</label>
                            <div class="input-wrapper">
                                <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                                    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                                </svg>
                                <input type="password" id="loginPassword" required autocomplete="current-password">
                            </div>
                        </div>
                        <div class="form-error" id="loginError"></div>
                        <button type="submit" class="btn btn-primary btn-full">
                            <span data-i18n="auth.login">تسجيل الدخول</span>
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M5 12h14M12 5l7 7-7 7"/>
                            </svg>
                        </button>
                    </form>

                    <!-- Register Form (hidden by default) -->
                    <form class="auth-form hidden" id="registerForm">
                        <div class="form-group">
                            <label for="regDisplayName" data-i18n="auth.displayName">الاسم الكامل</label>
                            <div class="input-wrapper">
                                <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                                    <circle cx="12" cy="7" r="4"/>
                                </svg>
                                <input type="text" id="regDisplayName" required>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="regUsername" data-i18n="auth.username">اسم المستخدم</label>
                            <div class="input-wrapper">
                                <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <circle cx="12" cy="12" r="4"/>
                                    <path d="M16 8v5a3 3 0 0 0 6 0v-1a10 10 0 1 0-3.92 7.94"/>
                                </svg>
                                <input type="text" id="regUsername" required autocomplete="username">
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="regPassword" data-i18n="auth.password">كلمة المرور</label>
                            <div class="input-wrapper">
                                <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                                    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                                </svg>
                                <input type="password" id="regPassword" required minlength="4" autocomplete="new-password">
                            </div>
                        </div>
                        <div class="form-group">
                            <label data-i18n="auth.role">الدور</label>
                            <div class="role-selector">
                                <label class="role-option selected">
                                    <input type="radio" name="role" value="student" checked>
                                    <div class="role-card">
                                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                            <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
                                            <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
                                        </svg>
                                        <span data-i18n="auth.student">طالب</span>
                                    </div>
                                </label>
                                <label class="role-option">
                                    <input type="radio" name="role" value="teacher">
                                    <div class="role-card">
                                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                                            <circle cx="9" cy="7" r="4"/>
                                            <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                                            <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                                        </svg>
                                        <span data-i18n="auth.teacher">معلم</span>
                                    </div>
                                </label>
                            </div>
                        </div>
                        <div class="form-error" id="registerError"></div>
                        <button type="submit" class="btn btn-primary btn-full">
                            <span data-i18n="auth.register">إنشاء حساب</span>
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                                <circle cx="8.5" cy="7" r="4"/>
                                <line x1="20" y1="8" x2="20" y2="14"/>
                                <line x1="23" y1="11" x2="17" y2="11"/>
                            </svg>
                        </button>
                    </form>

                    <div class="auth-switch">
                        <span id="authSwitchText" data-i18n="auth.noAccount">ليس لديك حساب؟</span>
                        <button class="btn-link" id="authSwitchBtn" data-i18n="auth.createAccount">إنشاء حساب جديد</button>
                    </div>

                    <div class="auth-about-divider"></div>
                    <div class="auth-about-box">
                        <button type="button" class="btn-link auth-about-btn" id="authAboutBtn" data-page="about">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="12" cy="12" r="10"/>
                                <path d="M12 16v-4M12 8h.01"/>
                            </svg>
                            <span data-i18n="home.aboutGuide">عن المشروع ودليل الاستخدام</span>
                        </button>
                    </div>
                </div>
            </div>
        </section>

        <!-- ===== Page: Home ===== -->
        <section class="page page-home hidden" id="pageHome">
            <!-- Content will be rendered by app.js -->
        </section>

        <!-- ===== Page: About & Guide ===== -->
        <section class="page page-about hidden" id="pageAbout">
            <!-- Content will be rendered by about.js -->
        </section>

        <!-- ===== Page: Challenges ===== -->
        <section class="page page-challenges hidden" id="pageChallenges">
            <!-- Content will be rendered by app.js -->
        </section>

        <!-- ===== Page: Challenge Session (4 phases) ===== -->
        <section class="page page-session hidden" id="pageSession">
            <!-- Content will be rendered by app.js -->
        </section>

        <!-- ===== Page: Profile ===== -->
        <section class="page page-profile hidden" id="pageProfile">
            <!-- Content will be rendered by app.js -->
        </section>

        <!-- ===== Page: Teacher Dashboard ===== -->
        <section class="page page-dashboard hidden" id="pageDashboard">
            <!-- Content will be rendered by app.js -->
        </section>

    </div>

    <!-- ===== Toast Notifications ===== -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- ===== App Scripts ===== -->
    <script src="js/i18n.js?v=20261121-api-fix"></script>
    <script src="js/database.js?v=20261121-api-fix"></script>
    <script src="js/auth.js?v=20261121-api-fix"></script>
    <script src="js/challenges.js?v=20261121-api-fix"></script>
    <script src="js/ai-engine.js?v=20261121-api-fix"></script>
    <script src="js/analytics.js?v=20261121-api-fix"></script>
    <script src="js/about.js?v=20261121-api-fix"></script>
    <script src="js/app.js?v=20261121-api-fix"></script>
</body>
</html>
